[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localforge"
version = "0.1.2"
description = "User-owned Linux web development environments"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7"]
license = {text = "MIT"}

[project.scripts]
localforge = "localforge.cli:main"
localforge-gui = "localforge.gui:main"

[tool.setuptools.packages.find]
include = ["localforge*"]

[tool.setuptools.package-data]
localforge = ["assets/*.php", "assets/*.txt", "assets/*.md"]
